<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caterpillar Game - Sprite Edition</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 480px;
      margin-bottom: 10px;
    }
    #ui {
      display: flex;
      gap: 24px;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .upload-btn {
      background-color: #2b2b2b;
      color: #a3e635;
      border: 2px solid #3f3f46;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .upload-btn:hover {
      background-color: #3f3f46;
      border-color: #a3e635;
    }
    input[type="file"] {
      display: none;
    }
    canvas {
      background-color: #18241b;
      border: 4px solid #2d4232;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    #controls {
      margin-top: 12px;
      color: #9ca3af;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div id="ui">
      <div>Score: <span id="score">0</span> / 20</div>
      <div>Length: <span id="length">3</span></div>
    </div>
    <label class="upload-btn" title="Select the generated AI sprite sheet image">
      Load Generated Image
      <input type="file" id="spriteUpload" accept="image/*">
    </label>
  </div>

  <!-- 20x20 grid at 24px per tile = 480x480 canvas -->
  <canvas id="gameCanvas" width="480" height="480"></canvas>
  <div id="controls">Use <b>Arrow Keys</b> or <b>WASD</b> to steer. Press <b>Space</b> to start / restart.</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const lengthEl = document.getElementById('length');
    const spriteUpload = document.getElementById('spriteUpload');

    const GRID_SIZE = 24;
    const TILE_COUNT = canvas.width / GRID_SIZE; // 20x20 grid
    const GAME_SPEED = 110; // milliseconds per tick
    const WIN_SCORE = 20;

    // =========================================================================
    // BUILT-IN SPRITES (Matches the generated Caterpillar & Leaf artwork)
    // =========================================================================
    const headSprite = new Image();
    const leafSprite = new Image();
    let customSheetCanvasHead = null;
    let customSheetCanvasLeaf = null;

    const caterpillarSVG = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <g stroke="#112211" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 38 26 Q 28 8 20 14 Q 15 19 26 26" fill="#76c928"/>
        <path d="M 62 26 Q 72 8 80 14 Q 85 19 74 26" fill="#76c928"/>
        <circle cx="50" cy="56" r="34" fill="#9be53d"/>
      </g>
      <ellipse cx="62" cy="36" rx="8" ry="4" fill="#c7f774" transform="rotate(15 62 36)"/>
      <circle cx="36" cy="54" r="7.5" fill="#112211"/>
      <circle cx="64" cy="54" r="7.5" fill="#112211"/>
      <circle cx="34" cy="51.5" r="2.5" fill="#ffffff"/>
      <circle cx="62" cy="51.5" r="2.5" fill="#ffffff"/>
      <ellipse cx="26" cy="63" rx="5.5" ry="3" fill="#ff7369"/>
      <ellipse cx="74" cy="63" rx="5.5" ry="3" fill="#ff7369"/>
      <path d="M 45 60 Q 50 66 55 60" fill="none" stroke="#112211" stroke-width="5" stroke-linecap="round"/>
    </svg>`;

    const leafSVG = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <g stroke="#112211" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 28 72 L 16 86" stroke-width="11"/>
        <path d="M 28 72 L 16 86" stroke="#854d27" stroke-width="5"/>
        <path d="M 25 75 C 12 45 35 18 82 18 C 82 65 55 88 25 75 Z" fill="#329c34"/>
        <path d="M 27 73 L 66 34" fill="none" stroke-width="6"/>
        <path d="M 45 55 L 43 40" fill="none" stroke-width="5"/>
        <path d="M 56 44 L 54 31" fill="none" stroke-width="5"/>
        <path d="M 48 52 L 63 54" fill="none" stroke-width="5"/>
      </g>
    </svg>`;

    headSprite.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(caterpillarSVG);
    leafSprite.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(leafSVG);

    // Optional: Load the AI-generated image file & auto-remove white background
    spriteUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          customSheetCanvasHead = extractSpriteFromHalf(img, 0, 0, img.width / 2, img.height);
          customSheetCanvasLeaf = extractSpriteFromHalf(img, img.width / 2, 0, img.width / 2, img.height);
          draw();
          if (gameState === 'START') drawStartScreen();
          else if (gameState !== 'PLAYING') drawEndScreen();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function extractSpriteFromHalf(img, sx, sy, sw, sh) {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = sw;
      tempCanvas.height = sh;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

      const imgData = tCtx.getImageData(0, 0, sw, sh);
      const data = imgData.data;

      let minX = sw, minY = sh, maxX = 0, maxY = 0;

      for (let y = 0; y < sh; y++) {
        for (let x = 0; x < sw; x++) {
          const idx = (y * sw + x) * 4;
          const r = data[idx], g = data[idx + 1], b = data[idx + 2];
          if (r > 240 && g > 240 && b > 240) {
            data[idx + 3] = 0;
          } else {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      tCtx.putImageData(imgData, 0, 0);

      const cropW = Math.max(1, maxX - minX + 1);
      const cropH = Math.max(1, maxY - minY + 1);
      const croppedCanvas = document.createElement('canvas');
      croppedCanvas.width = cropW;
      croppedCanvas.height = cropH;
      croppedCanvas.getContext('2d').drawImage(tempCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
      return croppedCanvas;
    }

    // =========================================================================
    // PILLAR 1: STATE
    // Remembers the caterpillar's body segments (array of grid coordinates),
    // the food item's coordinate, current direction, and score.
    // =========================================================================
    let caterpillar = [];
    let food = { x: 0, y: 0 };
    let direction = { dx: 1, dy: 0 };
    let score = 0;

    let inputQueue = [];
    let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER', or 'WIN'
    let gameLoopTimeout;

    // Sets up the initial board state and displays the Start Screen before moving
    function setupInitialScreen() {
      caterpillar = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { dx: 1, dy: 0 };
      inputQueue = [];
      score = 0;
      gameState = 'START';

      updateUI();
      spawnFood();
      draw();
      drawStartScreen();
    }

    // Starts or restarts the active game loop
    function startGame() {
      caterpillar = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { dx: 1, dy: 0 };
      inputQueue = [];
      score = 0;
      gameState = 'PLAYING';

      updateUI();
      spawnFood();

      clearTimeout(gameLoopTimeout);
      gameLoop();
    }

    function gameLoop() {
      if (gameState !== 'PLAYING') {
        drawEndScreen();
        return;
      }

      update();
      draw();

      if (gameState === 'PLAYING') {
        gameLoopTimeout = setTimeout(gameLoop, GAME_SPEED);
      } else {
        drawEndScreen();
      }
    }

    // =========================================================================
    // PILLAR 2: INPUT CONTROLS
    // Arrow keys (or WASD) to change the direction of the caterpillar's head.
    // Space bar starts the game from the intro screen or restarts after Game Over.
    // =========================================================================
    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', ' '].includes(e.key)) {
        e.preventDefault();
      }

      // Press Space to start from the title screen or restart after Game Over / Win
      if (gameState !== 'PLAYING' && (e.code === 'Space' || e.key === ' ')) {
        startGame();
        return;
      }

      if (gameState !== 'PLAYING') return;

      const lastDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : direction;
      let newDir = null;

      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          if (lastDir.dy === 0) newDir = { dx: 0, dy: -1 };
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          if (lastDir.dy === 0) newDir = { dx: 0, dy: 1 };
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          if (lastDir.dx === 0) newDir = { dx: -1, dy: 0 };
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          if (lastDir.dx === 0) newDir = { dx: 1, dy: 0 };
          break;
      }

      if (newDir && inputQueue.length < 2) {
        inputQueue.push(newDir);
      }
    });

    // =========================================================================
    // PILLAR 3 & 4: UPDATE LOGIC & WIN CONDITION
    // Moves forward by adding a new head and popping the tail.
    // Keeps tail & increases score on food. Dies on wall or body collision.
    // Triggers "You Win" screen at score 20.
    // =========================================================================
    function update() {
      if (inputQueue.length > 0) {
        direction = inputQueue.shift();
      }

      const newHead = {
        x: caterpillar[0].x + direction.dx,
        y: caterpillar[0].y + direction.dy
      };

      // Wall collision check
      if (newHead.x < 0 || newHead.x >= TILE_COUNT || newHead.y < 0 || newHead.y >= TILE_COUNT) {
        gameState = 'GAMEOVER';
        return;
      }

      const ateFood = (newHead.x === food.x && newHead.y === food.y);

      if (!ateFood) {
        caterpillar.pop();
      }

      // Self-collision check
      for (let segment of caterpillar) {
        if (newHead.x === segment.x && newHead.y === segment.y) {
          gameState = 'GAMEOVER';
          return;
        }
      }

      caterpillar.unshift(newHead);

      if (ateFood) {
        score += 1;
        updateUI();

        if (score >= WIN_SCORE) {
          gameState = 'WIN';
          return;
        }

        spawnFood();
      }
    }

    function updateUI() {
      scoreEl.textContent = score;
      lengthEl.textContent = caterpillar.length;
    }

    function spawnFood() {
      const availableSpaces = [];
      for (let x = 0; x < TILE_COUNT; x++) {
        for (let y = 0; y < TILE_COUNT; y++) {
          const isOccupied = caterpillar.some(seg => seg.x === x && seg.y === y);
          if (!isOccupied) {
            availableSpaces.push({ x, y });
          }
        }
      }

      if (availableSpaces.length > 0) {
        const randomIndex = Math.floor(Math.random() * availableSpaces.length);
        food = availableSpaces[randomIndex];
      }
    }

    // =========================================================================
    // RENDERING: SPRITES, START OVERLAY & END OVERLAY
    // =========================================================================
    function draw() {
      // Checkerboard grass-toned background
      for (let x = 0; x < TILE_COUNT; x++) {
        for (let y = 0; y < TILE_COUNT; y++) {
          ctx.fillStyle = (x + y) % 2 === 0 ? '#18241b' : '#1d2b20';
          ctx.fillRect(x * GRID_SIZE, y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
        }
      }

      // 1. Draw Leaf Food Sprite
      const leafSource = customSheetCanvasLeaf || leafSprite;
      ctx.drawImage(
        leafSource,
        food.x * GRID_SIZE - 2,
        food.y * GRID_SIZE - 2,
        GRID_SIZE + 4,
        GRID_SIZE + 4
      );

      // 2. Draw Caterpillar Body Segments (from tail to neck)
      for (let i = caterpillar.length - 1; i >= 1; i--) {
        const seg = caterpillar[i];
        const cx = seg.x * GRID_SIZE + GRID_SIZE / 2;
        const cy = seg.y * GRID_SIZE + GRID_SIZE / 2;
        const radius = GRID_SIZE * 0.44;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = i % 2 === 0 ? '#68c12c' : '#8ce03b';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#112211';
        ctx.stroke();
      }

      // 3. Draw Caterpillar Head Sprite
      const head = caterpillar[0];
      const hx = head.x * GRID_SIZE + GRID_SIZE / 2;
      const hy = head.y * GRID_SIZE + GRID_SIZE / 2;
      const headSize = GRID_SIZE * 1.35;
      const headSource = customSheetCanvasHead || headSprite;

      ctx.save();
      ctx.translate(hx, hy);

      if (direction.dx === -1) {
        ctx.scale(-1, 1);
      } else if (direction.dy === -1) {
        ctx.rotate(-0.15);
      } else if (direction.dy === 1) {
        ctx.rotate(0.15);
      }

      ctx.drawImage(headSource, -headSize / 2, -headSize / 2, headSize, headSize);
      ctx.restore();
    }

    function drawStartScreen() {
      // Dark translucent backdrop
      ctx.fillStyle = 'rgba(12, 18, 14, 0.88)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Card border & container
      ctx.fillStyle = '#18241b';
      ctx.strokeStyle = '#3b593f';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(35, 35, canvas.width - 70, canvas.height - 70, 12);
      ctx.fill();
      ctx.stroke();

      // Draw preview sprites at the top of the card
      const headSource = customSheetCanvasHead || headSprite;
      const leafSource = customSheetCanvasLeaf || leafSprite;
      ctx.drawImage(headSource, canvas.width / 2 - 52, 52, 48, 48);
      ctx.drawImage(leafSource, canvas.width / 2 + 8, 54, 44, 44);

      ctx.textAlign = 'center';

      // Title
      ctx.fillStyle = '#9be53d';
      ctx.font = 'bold 28px system-ui, sans-serif';
      ctx.fillText('HUNGRY CATERPILLAR', canvas.width / 2, 132);

      // Goal Section
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px system-ui, sans-serif';
      ctx.fillText('🎯 GOAL', canvas.width / 2, 172);

      ctx.fillStyle = '#d1d5db';
      ctx.font = '14px system-ui, sans-serif';
      ctx.fillText('Eat 20 leaves to grow to length 23 and win!', canvas.width / 2, 196);
      ctx.fillText('Avoid crashing into the walls or your own body.', canvas.width / 2, 218);

      // Controls Section
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px system-ui, sans-serif';
      ctx.fillText('🎮 CONTROLS', canvas.width / 2, 265);

      ctx.fillStyle = '#d1d5db';
      ctx.font = '14px system-ui, sans-serif';
      ctx.fillText('Arrow Keys or WASD : Steer the Caterpillar', canvas.width / 2, 290);
      ctx.fillText('Space Bar : Start or Restart the Game', canvas.width / 2, 312);

      // Call to Action Button / Prompt
      ctx.fillStyle = '#2d4232';
      ctx.beginPath();
      ctx.roundRect(105, 355, canvas.width - 210, 48, 8);
      ctx.fill();
      ctx.strokeStyle = '#9be53d';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#9be53d';
      ctx.font = 'bold 18px system-ui, sans-serif';
      ctx.fillText('PRESS SPACE TO START', canvas.width / 2, 385);
    }

    function drawEndScreen() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';
      ctx.font = 'bold 36px system-ui, sans-serif';

      if (gameState === 'WIN') {
        ctx.fillStyle = '#8ce03b';
        ctx.fillText('YOU WIN!', canvas.width / 2, canvas.height / 2 - 15);
      } else {
        ctx.fillStyle = '#ff7369';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);
      }

      ctx.font = '18px system-ui, sans-serif';
      ctx.fillStyle = '#e5e7eb';
      ctx.fillText(`Final Score: ${score} (Length: ${caterpillar.length})`, canvas.width / 2, canvas.height / 2 + 18);

      ctx.font = '15px system-ui, sans-serif';
      ctx.fillStyle = '#9ca3af';
      ctx.fillText('Press Space to Play Again', canvas.width / 2, canvas.height / 2 + 50);
    }

    // Load sprites and show the initial Start Screen without moving yet
    let spritesLoaded = 0;
    function onSpriteLoad() {
      spritesLoaded++;
      if (spritesLoaded === 2) {
        setupInitialScreen();
      }
    }
    headSprite.onload = onSpriteLoad;
    leafSprite.onload = onSpriteLoad;
  </script>
</body>
</html>
